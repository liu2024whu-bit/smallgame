<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>两面的云 · 改版对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3e9;color:#53634d;font:15px/1.9 "Microsoft YaHei","PingFang SC",sans-serif}main{max-width:1320px;margin:auto;padding:35px 5vw 60px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1,h2{font-family:KaiTi,serif;font-weight:400}h1{font-size:32px;margin:0}header p{font:11px Georgia,serif;letter-spacing:.1em;color:#8c967d;margin:0}a{color:inherit;text-underline-offset:5px}header a{font-size:13px}.lead{max-width:52em;font-size:14px;color:#7b856e;margin:23px 0}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 23px}select,button{font:inherit;color:inherit;background:#fffdf6;border:1px solid #cad2b9;border-radius:3px 7px 3px 4px;padding:7px 15px}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #8aa177;outline-offset:4px}nav{display:flex;flex-wrap:wrap;gap:9px}button[aria-selected=true]{background:#e7edda;border-color:#9faf8e}.viewer{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:26px;align-items:start;margin:22px 0}.picture{display:block;padding:0;width:100%;cursor:zoom-in;line-height:0}.picture img{width:100%;max-height:800px;object-fit:contain;display:block;height:auto}.notes h2{font-size:24px;line-height:1.6;margin:4px 0 15px}.notes p{font-size:13px;color:#78826b}.film{margin-top:35px}.film h2{font-size:25px}.film video{display:block;width:min(100%,1100px);background:#efeddf;border:1px solid #d4dac7;border-radius:4px}.film p,footer{max-width:65em;color:#858d77;font-size:12px}footer{border-top:1px solid #d7dccc;margin-top:35px;padding-top:20px}dialog{padding:8px;width:min(95vw,1600px);max-height:94vh;border:1px solid #b9c4aa;background:#fffdf5}dialog img{display:block;max-width:100%;max-height:87vh;margin:auto}dialog button{position:absolute;right:15px;top:15px}dialog::backdrop{background:#35442ca6}[hidden]{display:none!important}@media(max-width:850px){main{padding:24px 17px 45px}header{display:block}header>a{display:inline-block;margin-top:15px}h1{font-size:28px}.viewer{grid-template-columns:1fr}.controls{gap:12px}}

<main><header><div><p>BEFORE THE TWENTIETH ORBIT</p><h1>两面的云 · 改版对照</h1></div><a href="../../admin.html?page=cloud">实际试玩 ↗</a></header>
<p class="lead">一只木纸景，两面的风。纸片转过去，另一处也会跟着走。这里留着几轮试作，以及当前版本的正面、背面和解开以后。</p>
<div class="controls"><select id="view" aria-label="想看哪一处"><option value="compare">改版对照</option><option value="back">背面的星</option><option value="paired">正面合上了</option><option value="pairedBack">星还分着</option><option value="done">木扇开了</option><option value="doneBack">合上的星</option><option value="unfound">先看看它</option><option value="room">回到窗边</option><option value="phone">小屏里的样子</option><option value="phoneLook">凑近一点</option><option value="later">纸景背后的透纸</option><option value="album">画册里的云</option></select><nav role="tablist" aria-label="比较版本"><button role="tab" data-version="0">旧版</button><button role="tab" data-version="1">第一轮</button><button role="tab" data-version="2">第二轮</button><button role="tab" data-version="3">当前版</button></nav></div>
<section class="viewer"><button class="picture" aria-label="放大当前画面"><img id="picture" alt=""></button><aside class="notes"><h2 id="title"></h2><p id="change"></p><p id="reason"></p></aside></section>
<section class="film"><h2>风绕了一圈。</h2><video controls preload="metadata" src="playthrough.mp4" poster="current.webp"></video><p>真实鼠标与键盘操作：牵转纸环、核对背面、再回来，木扇打开后回到窗边。录像另配项目原创《窗边》，不是浏览器实时混音；实际游戏另有纸张与卡榫声。</p><a href="playthrough.mp4" download>保存这段演示</a></section>
<footer>后续的实际取物调整见<a href="../pickups/">拿起以后</a>。本页保留这一轮机关改版的过程。旧稿只用于比较；游戏保留当前实现。试玩与正式存档分开。其他机关、收藏与角色动作仍按清单继续逐个打磨。</footer></main>
<dialog id="zoom"><button aria-label="返回">×</button><img alt="放大的画面"></dialog>
<script>
const versions=[
 ['old.webp','数字在动，云还没动。','旧版的转盘放在画外，纸景上的绳线与挂签解释不了实际联动。','这一轮从实际操作重新审查，保留有用的关系，替换呈现和输入。'],
 ['first.webp','纸环先转了起来。','前壳、后壳、侧扇、线轴和两层纸分别制作，彼此的位置开始对齐。','试作里两层纸颜色太接近，缩小后也难分辨。'],
 ['second.webp','这一面合上了。','蓝纸和白纸分开，纸环本身也能牵动线轴。这里的正面已经合拢，背面的星还分着。','触摸测试发现浏览器会接管拖动，后来换了环形命中区域的原生控件。'],
 ['current.webp','两面的风，牵在一起。','转一处，两片跟着走。鳐、纸鸟和背面的星都合上，木扇才会打开。','两只纸人按实机参考新绘，固定在同一块侧扇上；还保留了棉线拖放、取消、撤销和解开后的翻面。']
];
const views={
 back:['back.webp','还有另一面。','大小齿轮连着同一片纸，背面旋向随实际翻面对应。','小齿轮转得快，纸环也跟着多走一段。'],
 paired:['paired.webp','先别急着走。','鳐和纸鸟都合上了，木扇还没有开。','正面有四组可能，背面才会留下其中一组。'],
 pairedBack:['paired-back.webp','星还分着。','同一组线轴，连着正反两面。','看另一面不算一次解谜，也不会占掉撤销。'],
 done:['done.webp','木扇开了。','小镜子和摇柄在里面，棉线仍然留在手边。','合好的纸环不会换成另一张完成图，侧扇沿自己的铰链展开。'],
 doneBack:['done-back.webp','星也合上了。','解开后，还可以翻回来看。','按钮只锁住会改变答案的部分。'],
 unfound:['unfound.webp','先看看它。','还没拾起棉线，也能看看纸环和背板。','手边只会出现真正收下的物件。'],
 room:['room.webp','回到窗边。','远处的木匣也开着，纸环还是刚才的角度。','近景、房间、导航和画册共用同一只物件。'],
 phone:['phone.webp','小一点，也能牵动。','触摸范围与画里的零件尺寸分开，不把线轴撑得过大。','拖完立即连点，仍然一次一下。'],
 phoneLook:['phone-look.webp','凑近一点。','想看清纸片时，可以拿近，再向旁边移一移。','放远以后，纸片排列和正背视角都还在。'],
 later:['later.webp','后面还夹着透纸。','后续留白机关用同一个背板，避免换成另一只木匣。','这里仅同步了形象与尺寸，P13的完整玩法和演出另行继续审查。'],
 album:['album.webp','画册里的云。','那一页也用同一只纸景。','画页本身的完整改造仍按P15继续，不以换一张图代替。']
};
let selected=3;const control=document.querySelector('#view'),nav=document.querySelector('nav'),pic=document.querySelector('#picture'),zoom=document.querySelector('#zoom');
function render(){nav.hidden=control.value!=='compare';document.querySelectorAll('[data-version]').forEach(b=>{const on=Number(b.dataset.version)===selected;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;});const [src,title,change,reason]=control.value==='compare'?versions[selected]:views[control.value];pic.src=src;pic.alt=title;for(const [key,value]of Object.entries({title,change,reason}))document.querySelector('#'+key).textContent=value;}
control.onchange=render;document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.version);render();});nav.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();selected=e.key==='Home'?0:e.key==='End'?3:(selected+(e.key==='ArrowRight'?1:3))%4;render();document.querySelector('[data-version="'+selected+'"]').focus();};
document.querySelector('.picture').onclick=()=>{zoom.querySelector('img').src=pic.src;zoom.showModal();};zoom.querySelector('button').onclick=()=>zoom.close();render();
</script></html>
