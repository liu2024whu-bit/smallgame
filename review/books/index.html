</style><main><header><div><p>BEFORE THE TWENTIETH ORBIT</p><h1>书脊之间 · 改版对照</h1></div><a href="../../admin.html?page=books">实际试玩 ↗</a></header><p class="lead">有的线索在夹页里，有的在纸签的背面。书挪对了，还要拉一拉下面的抽屉。这里保留旧版、试作与当前画面，也能看看同一件东西放回房间里的样子。</p><div class="controls"><select id="view" aria-label="想看哪一处"><option value="compare">改版对照</option><option value="fit">那张签，放在这里。</option><option value="prince">小王子的夹页。</option><option value="pride">这张纸签，在右边。</option><option value="paper">隔着两本书。</option><option value="open">原来还藏着一层。</option><option value="page-only">还留着一根针。</option><option value="taken">抽屉空了。</option><option value="room">又回到原来的房间。</option><option value="room-closed">还没拉开的时候。</option><option value="shelf-context">和原来的书放在一起。</option><option value="room-first">曾经多套了一层小柜。</option><option value="phone-old">旧版手机。</option><option value="phone-current">手机里的书排。</option><option value="phone-fit">小纸夹也留得住。</option><option value="phone-prince">拿近看夹页。</option><option value="phone-pride">看看另一张书签。</option><option value="phone-paper">借阅签的纸背。</option><option value="phone-open">抽屉已经打开。</option><option value="phone-page-only">画页拿走以后。</option><option value="phone-taken">取完以后，仍可回看。</option></select><nav role="tablist" aria-label="比较版本"><button role="tab" data-version="0">旧版</button><button role="tab" data-version="1">试作</button><button role="tab" data-version="2">再看装帧</button><button role="tab" data-version="3">当前</button></nav></div><section class="viewer"><button class="picture" aria-label="放大当前画面"><img id="picture" alt=""></button><aside class="notes"><h2 id="title"></h2><p id="change"></p><p id="reason"></p></aside></section><section class="film"><h2>把书挪一挪。</h2><video controls preload="metadata" src="playthrough.mp4" poster="current.webp"></video><p>本关真实鼠标操作，进入时前置机关已解开。装签、翻看、抽出夹页、拖排、拉屉，再分别拿起画页与针。录像另配项目原创《窗边》，不是浏览器实时混音；游戏内另有材料声。完整新开局路线另外核对。</p><a href="playthrough.mp4" download>保存这段演示</a></section><footer>运行只保留当前方案。规则、库存、画面与输入分别负责；全关可达只证明通路，不代替后续机关的独立精修。此页和后台试玩不改正式进度。</footer></main><dialog id="zoom"><button aria-label="返回">×</button><img alt="放大的画面"></dialog><script>const versions=[["old.webp", "五本书，挤在同一张关系题里。", "旧版把关系一次写满，手机用小箭头挪动；借阅签和透片只是准入条件。", "旧画面保留作比较，运行里已移除旧书架与箭头绑定。"], ["first.webp", "先把书真正拿起来。", "这一轮已经能拖排、抽看和装签，但书架、书名和角色取框还未协调。", "记录试作问题；双人图集取图错误与手机悬空随后修正。"], ["wide.webp", "这一版，书还是太厚了。", "撤掉外框以后，较厚的装饰书脊仍与原场景里的书不合。", "后续以原书柜为参照重绘薄书，排版也随装帧重做。"], ["current.webp", "书页里，还有一点小线索。", "薄书、夹页和角色纸签围着同一处书架。横向拖排，抽出或点开看看。", "保留宽触区；书名采用印刷感字体，纸上小字另有手写感。"]];const views={"fit": ["fit.webp", "那张签，放在这里。", "纸夹托住借阅签，书前的木挡条放下。", "能从手边拖入，也能直接放置；纸签可以取回，规则不检查读过哪页。"], "prince": ["prince.webp", "小王子的夹页。", "不在两端，知更鸟挨在后面。", "必要关系留在纸上，图示与书排使用同款书。"], "pride": ["pride.webp", "这张纸签，在右边。", "另一条关系，夹在《傲慢与偏见》里。", "角色沿用原有图集，完整取框；不重新生成另一套造型。"], "paper": ["paper.webp", "隔着两本书。", "翻过借阅签，纸上画着书签之间的空位。", "前后两面属于同一张纸，翻面只改变观察姿态。"], "open": ["open.webp", "原来还藏着一层。", "排好书后，抽屉需要实际拉开。", "拉动时内容随托盘露出，正式打开后才可拿取。"], "page-only": ["page-only.webp", "还留着一根针。", "画页先拿走了，针还在。", "两件东西分别领取与保存，没有第二份库存。"], "taken": ["taken.webp", "抽屉空了。", "书和夹页仍能再看看。", "返回、再次进入或读档后，已经拿走的东西不重生。"], "room": ["room.webp", "又回到原来的房间。", "书排与抽屉沿着原层板放置。", "局部画面裁去菜单，近远景共享实际排列、开屉与领取状态。"], "room-closed": ["room-closed.webp", "还没拉开的时候。", "书落在层板上，右边仍是原来的花。", "远景保留原书柜结构，没有把整张放大面板缩进去。"], "shelf-context": ["shelf-context.webp", "和原来的书放在一起。", "上面是原场景的书，下面是当前可操作书排。", "对照装帧、厚薄、色彩、字体和落脚处，而不是只看单件图。"], "room-first": ["room-first.webp", "曾经多套了一层小柜。", "早期整块金色外框与原柜的结构、材质不合。", "后续重画木件与相机，撤掉远景额外外框。"], "phone-old": ["phone-old.webp", "旧版手机。", "关系句和小箭头挤在一处。", "当前按手机重新安排取景，书的实际触区至少44像素。"], "phone-current": ["phone-current.webp", "手机里的书排。", "同一套书件与规则，为小屏重新取景。", "触屏拖排、抽看、翻签、取消、开屉及分次拿取已实际操作；桌面与手机不另存答案。"], "phone-fit": ["phone-fit.webp", "小纸夹也留得住。", "同一套书件与规则，为小屏重新取景。", "触屏拖排、抽看、翻签、取消、开屉及分次拿取已实际操作；桌面与手机不另存答案。"], "phone-prince": ["phone-prince.webp", "拿近看夹页。", "同一套书件与规则，为小屏重新取景。", "触屏拖排、抽看、翻签、取消、开屉及分次拿取已实际操作；桌面与手机不另存答案。"], "phone-pride": ["phone-pride.webp", "看看另一张书签。", "同一套书件与规则，为小屏重新取景。", "触屏拖排、抽看、翻签、取消、开屉及分次拿取已实际操作；桌面与手机不另存答案。"], "phone-paper": ["phone-paper.webp", "借阅签的纸背。", "同一套书件与规则，为小屏重新取景。", "触屏拖排、抽看、翻签、取消、开屉及分次拿取已实际操作；桌面与手机不另存答案。"], "phone-open": ["phone-open.webp", "抽屉已经打开。", "同一套书件与规则，为小屏重新取景。", "触屏拖排、抽看、翻签、取消、开屉及分次拿取已实际操作；桌面与手机不另存答案。"], "phone-page-only": ["phone-page-only.webp", "画页拿走以后。", "同一套书件与规则，为小屏重新取景。", "触屏拖排、抽看、翻签、取消、开屉及分次拿取已实际操作；桌面与手机不另存答案。"], "phone-taken": ["phone-taken.webp", "取完以后，仍可回看。", "同一套书件与规则，为小屏重新取景。", "触屏拖排、抽看、翻签、取消、开屉及分次拿取已实际操作；桌面与手机不另存答案。"]};let selected=versions.length-1;const control=document.querySelector('#view'),nav=document.querySelector('nav'),pic=document.querySelector('#picture'),zoom=document.querySelector('#zoom');
function render(){nav.hidden=control.value!=='compare';document.querySelectorAll('[data-version]').forEach(b=>{const on=Number(b.dataset.version)===selected;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;});const [src,title,change,reason]=control.value==='compare'?versions[selected]:views[control.value];pic.src=src;pic.alt=title;for(const [key,value]of Object.entries({title,change,reason}))document.querySelector('#'+key).textContent=value;}
control.onchange=render;document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.version);render();});nav.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();selected=e.key==='Home'?0:e.key==='End'?versions.length-1:(selected+(e.key==='ArrowRight'?1:-1)+versions.length)%versions.length;render();document.querySelector('[data-version="'+selected+'"]').focus();};
document.querySelector('.picture').onclick=()=>{zoom.querySelector('img').src=pic.src;zoom.showModal();};zoom.querySelector('button').onclick=()=>zoom.close();render();</script></html>
