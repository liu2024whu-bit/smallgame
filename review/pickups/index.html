<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拿起以后 · 改版对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3e9;color:#53634d;font:15px/1.9 "Microsoft YaHei","PingFang SC",sans-serif}main{max-width:1320px;margin:auto;padding:35px 5vw 60px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1,h2{font-family:KaiTi,serif;font-weight:400}h1{font-size:32px;margin:0}a{color:inherit;text-underline-offset:5px}header a{font-size:13px}.lead{max-width:52em;font-size:14px;color:#7b856e;margin:23px 0}.controls,nav{display:flex;flex-wrap:wrap;align-items:center;gap:12px}select,button{font:inherit;color:inherit;background:#fffdf6;border:1px solid #cad2b9;border-radius:3px 7px 3px 4px;padding:7px 15px}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #8aa177;outline-offset:4px}button[aria-selected=true]{background:#e7edda;border-color:#9faf8e}.viewer{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:26px;align-items:start;margin:22px 0}.picture{display:block;padding:0;width:100%;cursor:zoom-in;line-height:0}.picture img{width:100%;max-height:800px;object-fit:contain;display:block;height:auto}.notes h2{font-size:24px;line-height:1.6;margin:4px 0 15px}.notes p{font-size:13px;color:#78826b}.film{margin-top:35px}.film video{display:block;width:min(100%,1100px);background:#efeddf;border:1px solid #d4dac7;border-radius:4px}.film p,footer{max-width:65em;color:#858d77;font-size:12px}footer{border-top:1px solid #d7dccc;margin-top:35px;padding-top:20px}dialog{padding:8px;width:min(95vw,1600px);max-height:94vh;border:1px solid #b9c4aa;background:#fffdf5}dialog img{display:block;max-width:100%;max-height:87vh;margin:auto}dialog button{position:absolute;right:15px;top:15px}dialog::backdrop{background:#35442ca6}[hidden]{display:none!important}@media(max-width:850px){main{padding:24px 17px 45px}header{display:block}header>a{display:inline-block;margin-top:15px}h1{font-size:28px}.viewer{grid-template-columns:1fr}}
</style>
<main><header><h1>拿起以后 · 改版对照</h1><a href="../../admin.html?page=paper-done">实际试玩</a></header>
<p class="lead">抽屉打开了，那张透片还在里面。拿起以后，才算收到了手边。还有两面的云，圆镜和摇柄可以一件件取出来。</p>
<div class="controls"><select id="view" aria-label="想看哪一处"><option value="compare">改版对照</option><option value="taken">透片收好了</option><option value="cloud">两扇侧袋</option><option value="cloudTaken">侧袋空了</option><option value="phone">手机里的抽屉</option><option value="phoneCloud">手机里的云景</option></select><nav role="tablist" aria-label="比较版本"><button role="tab" data-version="0">旧版</button><button role="tab" data-version="1">第一轮</button><button role="tab" data-version="2">当前版</button></nav></div>
<section class="viewer"><button class="picture" aria-label="放大当前画面"><img id="picture" alt=""></button><aside class="notes"><h2 id="title"></h2><p id="change"></p><p id="reason"></p></aside></section>
<section class="film"><h2>刚才还在这里。</h2><video controls preload="metadata" src="playthrough.mp4" poster="current.webp"></video><p>实际鼠标点取。这里预先把机关置于已解开状态，只演示拿取，不代表通关过程；末尾稍作静帧停留，另配项目原创《窗边》。</p><a href="playthrough.mp4" download>保存这段演示</a></section>
<footer>未拿走、只拿一件与已经收好都会保存。旧进度中原来已经获得的工具继续保留。其余关卡的具体取物位置和美术表现仍随逐关精修继续调整。</footer></main>
<dialog id="zoom"><button aria-label="返回">×</button><img alt="放大的画面"></dialog>
<script>
const versions=[['old.webp','还没拿，就到手边了。','旧版解开机关便自动发放工具，画面里的东西仍然留着。','完成与拿取没有区分。'],['first.webp','纸挡住了。','第一轮有了实物点取，但纸稿挡住透片中心，薄片也垂出了抽屉。','实际命中检查发现了问题，后面重新安排了落点。'],['current.webp','抽屉里的那张。','透片平放在抽屉底面，纸稿另有落纸的位置。','拿起后抽屉变空；薄片仍是同一张，手边也只会收下一份。']];
const views={taken:['taken.webp','收好啦。','抽屉已经空了，纸稿仍在。','再次进来或读回进度，透片都不会重新出现。'],cloud:['cloud.webp','两扇侧袋。','纸人随着木扇打开，圆镜和摇柄露了出来。','两件可以分开取，不会因为先拿一件就把另一件也收走。'],cloudTaken:['cloud-taken.webp','空下来的位置。','圆镜和摇柄已经拿在手边，侧袋留在原处。','之后用上它们，再回来看看，仍是刚才收好的样子。'],phone:['phone.webp','小抽屉，也能拿到。','纸稿和透片各有落点，触摸不必寻找边缘缝隙。','减少动态时直接收好；键盘也能拿起。'],phoneCloud:['phone-cloud.webp','一件一件来。','手机里也保留两处来源。','取走以后，那一处便空了。']};
let selected=2;const control=document.querySelector('#view'),nav=document.querySelector('nav'),pic=document.querySelector('#picture'),zoom=document.querySelector('#zoom');
function render(){nav.hidden=control.value!=='compare';document.querySelectorAll('[data-version]').forEach(b=>{const on=Number(b.dataset.version)===selected;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;});const [src,title,change,reason]=control.value==='compare'?versions[selected]:views[control.value];pic.src=src;pic.alt=title;for(const [key,value]of Object.entries({title,change,reason}))document.querySelector('#'+key).textContent=value;}
control.onchange=render;document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.version);render();});nav.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();selected=e.key==='Home'?0:e.key==='End'?2:(selected+(e.key==='ArrowRight'?1:2))%3;render();document.querySelector('[data-version="'+selected+'"]').focus();};
document.querySelector('.picture').onclick=()=>{zoom.querySelector('img').src=pic.src;zoom.showModal();};zoom.querySelector('button').onclick=()=>zoom.close();render();
</script></html>
